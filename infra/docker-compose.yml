name: crime-intel-platform

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cip
      POSTGRES_PASSWORD: cip_dev_password
      POSTGRES_DB: crime_intel
    ports:
      - "55432:5432" # non-standard host port — this machine already runs multiple local Postgres instances on 5432/5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cip -d crime_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: cip-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/cip_dev_password
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  neo4j_data:
