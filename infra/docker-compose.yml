name: crime-intel-platform

# Postgres is hosted on Neon (https://neon.tech) — see apps/core-api/.env.example.
# Neo4j still runs locally; there's no managed alternative wired up for it.
services:
  neo4j:
    image: neo4j:5-community
    container_name: cip-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/cip_dev_password
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
